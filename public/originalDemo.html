<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Rain With Enhanced Controls - Original</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      position: relative;
      height: 100vh;
      background: #f9f9f9;
    }
    .rain-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }
    /* Outer container for each emoji (falling movement) */
    .emoji {
      position: absolute;
      top: -50px;
      animation: fall linear forwards;
      transform: translateY(-100%);
    }
    /* Inner container for the emoji character (spinning) */
    .emoji-inner {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transform-origin: center center;
      animation: spin linear infinite;
      transition: opacity 0.5s ease-out;
    }
    @keyframes fall {
      0% {
        transform: translateY(-50px);
      }
      100% {
        transform: translateY(120vh);
      }
    }
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
    @keyframes fadeout {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }
    .controls-container {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 95vw;
      max-height: 85vh;
      overflow-y: auto;
    }
    .control-header {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
      font-size: 18px;
      font-weight: bold;
    }
    .button-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }
    .options-container {
      display: grid;
      gap: 15px;
      max-width: 100%;
    }
    .section {
      background: rgba(248, 249, 250, 0.8);
      border-radius: 10px;
      padding: 15px;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .section-title {
      font-weight: bold;
      color: #495057;
      margin-bottom: 12px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .option-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
    }
    .option-row:last-child {
      margin-bottom: 0;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    label {
      display: flex;
      align-items: center;
      cursor: pointer;
      font-size: 13px;
      color: #495057;
      font-weight: 500;
    }
    label input[type="checkbox"] {
      margin-right: 8px;
      width: 16px;
      height: 16px;
      accent-color: #667eea;
    }
    label input[type="number"] {
      margin-left: 8px;
      width: 60px;
      padding: 4px 8px;
      border: 1px solid #dee2e6;
      border-radius: 5px;
      font-size: 12px;
      background: white;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
    }
    .label-text {
      margin-right: 0;
      flex: 1;
    }
    .basic-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
    }
    .layer-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }
    .layer-section {
      background: white;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid rgba(0, 0, 0, 0.06);
    }
    .layer-title {
      font-weight: bold;
      color: #343a40;
      margin-bottom: 10px;
      font-size: 13px;
      text-align: center;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .front-layer .layer-title {
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    }
    .middle-layer .layer-title {
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    }
    .back-layer .layer-title {
      background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%);
    }
    .layer-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 6px;
    }
    .layer-row:last-child {
      margin-bottom: 0;
    }
    @media (max-width: 768px) {
      .layer-controls {
        grid-template-columns: 1fr;
      }
      .option-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="controls-container">
    <div class="control-header">🌧️ Emoji Rain Controls</div>
    
    <div class="button-container">
      <button id="rainButton">Make it Rain!</button>
      <button id="singleEmoji">Show Single Emoji</button>
      <button id="dropSingleEmoji">Drop Single Emoji</button>
      <button id="rainFewEmojis">Rain Few Emojis</button>
      <button id="clearEmojis">Clear Emojis</button>
    </div>
    
    <div class="options-container">
      <div class="section">
        <div class="section-title">Basic Settings</div>
        <div class="basic-controls">
          <label>
            <input type="checkbox" id="parallaxCheckbox" checked>
            <span class="label-text">Parallax</span>
          </label>
          <label>
            <input type="checkbox" id="blurCheckbox" checked>
            <span class="label-text">Blur</span>
          </label>
          <label>
            <span class="label-text">Speed (0-100)</span>
            <input type="number" id="baseSpeedInput" min="0" max="100" step="1" value="50">
          </label>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Layer Distribution</div>
        <div class="option-row">
          <label>
            <span class="label-text">Front Ratio</span>
            <input type="number" id="frontRatioInput" min="0" max="1000" step="1" value="100">
          </label>
          <label>
            <span class="label-text">Middle Ratio</span>
            <input type="number" id="middleRatioInput" min="0" max="1000" step="1" value="300">
          </label>
          <label>
            <span class="label-text">Back Ratio</span>
            <input type="number" id="backRatioInput" min="0" max="1000" step="1" value="70">
          </label>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Z-Index Control</div>
        <div class="option-row">
          <label>
            <span class="label-text">Mode</span>
            <select id="zIndexMode" style="margin-left: 8px; padding: 4px 8px; border: 1px solid #dee2e6; border-radius: 5px; font-size: 12px; background: white;">
              <option value="individual">Individual</option>
              <option value="relative">Relative</option>
              <option value="autoFront">Auto Front</option>
              <option value="autoBack">Auto Back</option>
            </select>
          </label>
        </div>
        <div class="option-row" id="zIndexControls">
          <label>
            <span class="label-text">Front Z-Index</span>
            <input type="number" id="frontZIndex" min="1" max="100" step="1" value="3">
          </label>
          <label>
            <span class="label-text">Middle Z-Index</span>
            <input type="number" id="middleZIndex" min="1" max="100" step="1" value="2">
          </label>
          <label>
            <span class="label-text">Back Z-Index</span>
            <input type="number" id="backZIndex" min="1" max="100" step="1" value="1">
          </label>
        </div>
        <div class="option-row" id="relativeZIndexControl" style="display: none;">
          <label>
            <span class="label-text">Base Z-Index (Middle)</span>
            <input type="number" id="baseZIndex" min="1" max="100" step="1" value="10">
          </label>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Layer Configuration</div>
        <div class="layer-controls">
          <!-- Front Layer -->
          <div class="layer-section front-layer">
            <div class="layer-title">Front Layer</div>
            <div class="layer-row">
              <label>
                <span class="label-text">Speed Min</span>
                <input type="number" id="frontSpeedRangeMin" min="0" max="10" step="0.1" value="0">
              </label>
              <label>
                <span class="label-text">Speed Max</span>
                <input type="number" id="frontSpeedRangeMax" min="0" max="10" step="0.1" value="2">
              </label>
            </div>
            <div class="layer-row">
              <label>
                <span class="label-text">Blur Min</span>
                <input type="number" id="frontBlurRangeMin" min="0" max="10" step="1" value="1">
              </label>
              <label>
                <span class="label-text">Blur Max</span>
                <input type="number" id="frontBlurRangeMax" min="0" max="10" step="1" value="2">
              </label>
            </div>
            <div class="layer-row">
              <label>
                <span class="label-text">Font Min</span>
                <input type="number" id="frontFontSizeMin" min="1" max="100" step="1" value="48">
              </label>
              <label>
                <span class="label-text">Font Max</span>
                <input type="number" id="frontFontSizeMax" min="1" max="100" step="1" value="72">
              </label>
            </div>
            <div class="layer-row">
              <label>
                <span class="label-text">Delay Min</span>
                <input type="number" id="frontDelayMin" min="0" max="10" step="0.1" value="0">
              </label>
              <label>
                <span class="label-text">Delay Max</span>
                <input type="number" id="frontDelayMax" min="0" max="10" step="0.1" value="0.2">
              </label>
            </div>
          </div>

          <!-- Middle Layer -->
          <div class="layer-section middle-layer">
            <div class="layer-title">Middle Layer</div>
            <div class="layer-row">
              <label>
                <span class="label-text">Speed Min</span>
                <input type="number" id="middleSpeedRangeMin" min="0" max="10" step="0.1" value="4">
              </label>
              <label>
                <span class="label-text">Speed Max</span>
                <input type="number" id="middleSpeedRangeMax" min="0" max="10" step="0.1" value="6">
              </label>
            </div>
            <div class="layer-row">
              <label>
                <span class="label-text">Blur Min</span>
                <input type="number" id="middleBlurRangeMin" min="0" max="10" step="1" value="0">
              </label>
              <label>
                <span class="label-text">Blur Max</span>
                <input type="number" id="middleBlurRangeMax" min="0" max="10" step="1" value="0">
              </label>
            </div>
            <div class="layer-row">
              <label>
                <span class="label-text">Font Min</span>
                <input type="number" id="middleFontSizeMin" min="1" max="100" step="1" value="16">
              </label>
              <label>
                <span class="label-text">Font Max</span>
                <input type="number" id="middleFontSizeMax" min="1" max="100" step="1" value="32">
              </label>
            </div>
            <div class="layer-row">
              <label>
                <span class="label-text">Delay Min</span>
                <input type="number" id="middleDelayMin" min="0" max="10" step="0.1" value="0">
              </label>
              <label>
                <span class="label-text">Delay Max</span>
                <input type="number" id="middleDelayMax" min="0" max="10" step="0.1" value="0.1">
              </label>
            </div>
          </div>

          <!-- Back Layer -->
          <div class="layer-section back-layer">
            <div class="layer-title">Back Layer</div>
            <div class="layer-row">
              <label>
                <span class="label-text">Speed Min</span>
                <input type="number" id="backSpeedRangeMin" min="0" max="10" step="0.1" value="7">
              </label>
              <label>
                <span class="label-text">Speed Max</span>
                <input type="number" id="backSpeedRangeMax" min="0" max="10" step="0.1" value="10">
              </label>
            </div>
            <div class="layer-row">
              <label>
                <span class="label-text">Blur Min</span>
                <input type="number" id="backBlurRangeMin" min="0" max="10" step="1" value="2">
              </label>
              <label>
                <span class="label-text">Blur Max</span>
                <input type="number" id="backBlurRangeMax" min="0" max="10" step="1" value="3">
              </label>
            </div>
            <div class="layer-row">
              <label>
                <span class="label-text">Font Min</span>
                <input type="number" id="backFontSizeMin" min="1" max="100" step="1" value="8">
              </label>
              <label>
                <span class="label-text">Font Max</span>
                <input type="number" id="backFontSizeMax" min="1" max="100" step="1" value="14">
              </label>
            </div>
            <div class="layer-row">
              <label>
                <span class="label-text">Delay Min</span>
                <input type="number" id="backDelayMin" min="0" max="10" step="0.1" value="0">
              </label>
              <label>
                <span class="label-text">Delay Max</span>
                <input type="number" id="backDelayMax" min="0" max="10" step="0.1" value="0.2">
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="rain-container" id="rainContainer"></div>

  <script>
    const parallaxConfig = {
      layerProperties: {
        front: {
          speedRange: [0, 2],
          blurRange: [1, 2],
          zIndex: 3,
          fontSizeRange: [48, 72],
          delayRange: [0, 0.2]
        },
        middle: {
          speedRange: [4, 6],
          blurRange: [0, 0],
          zIndex: 2,
          fontSizeRange: [16, 32],
          delayRange: [0, 0.1]
        },
        back: {
          speedRange: [7, 10],
          blurRange: [2, 3],
          zIndex: 1,
          fontSizeRange: [8, 14],
          delayRange: [0, 0.2]
        }
      },
      layerRatios: {
        front: 100,
        middle: 300,
        back: 70
      },
      defaultEmojis: ["🥗", "🍕", "🥪", "🍔", "🍎", "🍇"],
      baseSpeed: 50
    };

    const SPEED_ADJUSTMENT_FACTOR = 50 / 30;
    let parallaxEnabled = true;
    let blurEnabled = true;
    const themes = {
      lunchPlan: ["🥗", "🍕", "🥪", "🍔", "🍎", "🍇"],
      restaurant: ["🍽️", "🍴", "🍹", "🍤", "🍜", "🍣"]
    };

    const getRandomValue = (min, max) => Math.random() * (max - min) + min;

    const convertSpeedToFallDuration = (speedValue) => {
      let { baseSpeed } = parallaxConfig;
      baseSpeed = baseSpeed / SPEED_ADJUSTMENT_FACTOR;
      if (baseSpeed < 0) baseSpeed = 0;
      if (baseSpeed > 100) baseSpeed = 100;
      if (baseSpeed === 0) {
        return Number.POSITIVE_INFINITY;
      }
      const minDuration = 1;
      const maxDuration = 10;
      const fraction = speedValue / 10;
      let baseDuration = fraction * (maxDuration - minDuration) + minDuration;
      let fallDuration = baseDuration * (10 / baseSpeed);
      return fallDuration;
    };

    const distributeEmojis = (totalCount) => {
      const { layerRatios } = parallaxConfig;
      const ratioSum = Object.values(layerRatios).reduce((a, b) => a + b, 0);
      const distribution = {
        front: (layerRatios.front / ratioSum) * totalCount,
        middle: (layerRatios.middle / ratioSum) * totalCount,
        back: (layerRatios.back / ratioSum) * totalCount,
      };
      const roundedDistribution = {};
      let allocatedCount = 0;
      for (let layer in distribution) {
        roundedDistribution[layer] = Math.round(distribution[layer]);
        allocatedCount += roundedDistribution[layer];
      }
      let remainder = totalCount - allocatedCount;
      while (remainder !== 0) {
        for (let layer in roundedDistribution) {
          if (remainder > 0) {
            roundedDistribution[layer]++;
            remainder--;
            if (remainder === 0) break;
          } else {
            if (roundedDistribution[layer] > 0) {
              roundedDistribution[layer]--;
              remainder++;
              if (remainder === 0) break;
            }
          }
        }
      }
      return roundedDistribution;
    };

    const createDepthProperties = (layerKey) => {
      const layerConfig = parallaxConfig.layerProperties[layerKey];
      const randomSpeed = getRandomValue(...layerConfig.speedRange);
      const fallDuration = convertSpeedToFallDuration(randomSpeed);
      const blurAmount = getRandomValue(...layerConfig.blurRange);
      const finalFontSize = getRandomValue(...layerConfig.fontSizeRange);
      const randomDelay = getRandomValue(...layerConfig.delayRange);
      return {
        depth: layerKey,
        finalFontSize,
        fallDuration,
        blurAmount,
        delay: randomDelay,
        zIndex: layerConfig.zIndex
      };
    };

    const createEmoji = (emojiSet, drop = false, layerKey = null) => {
      if (!emojiSet || emojiSet.length === 0) {
        emojiSet = parallaxConfig.defaultEmojis;
      }
      const emojiChar = emojiSet[Math.floor(Math.random() * emojiSet.length)];
      const xPosition = getRandomValue(0, window.innerWidth);
      
      if (!layerKey) {
        if (parallaxEnabled) {
          const ratioSum = Object.values(parallaxConfig.layerRatios).reduce((a, b) => a + b, 0);
          const randomVal = getRandomValue(0, ratioSum);
          let cumulative = 0;
          for (let layer in parallaxConfig.layerRatios) {
            cumulative += parallaxConfig.layerRatios[layer];
            if (randomVal <= cumulative) {
              layerKey = layer;
              break;
            }
          }
        } else {
          layerKey = 'middle';
        }
      }
      
      const depthProps = createDepthProperties(layerKey);
      const {
        finalFontSize,
        fallDuration,
        blurAmount,
        delay,
        zIndex
      } = depthProps;
      
      const emojiElement = document.createElement("div");
      emojiElement.className = "emoji";
      emojiElement.style.zIndex = zIndex;
      
      if (drop) {
        emojiElement.style.left = `${xPosition}px`;
      } else {
        emojiElement.style.top = "50%";
        emojiElement.style.left = "50%";
        emojiElement.style.transform = "translate(-50%, -50%)";
      }
      
      if (isFinite(fallDuration)) {
        emojiElement.style.animationDuration = drop ? `${fallDuration}s` : `0s`;
        emojiElement.style.animationDelay = `${drop ? delay : 0}s`;
      } else {
        emojiElement.style.animationName = "none";
      }
      
      const emojiInner = document.createElement("div");
      emojiInner.className = "emoji-inner";
      emojiInner.textContent = emojiChar;
      emojiInner.style.fontSize = `${finalFontSize}px`;
      emojiInner.style.animationDuration = `${getRandomValue(2, 4)}s`;
      emojiInner.style.animationDelay = `0s`;
      
      const finalBlur = blurEnabled ? blurAmount : 0;
      emojiInner.style.filter = `blur(${finalBlur}px)`;
      
      emojiElement.appendChild(emojiInner);
      
      return emojiElement;
    };

    let frontInterval = null;
    let frontRemaining = 0;

    const triggerRain = (emojiSet) => {
      const rainContainer = document.getElementById("rainContainer");
      const count = 20;
      
      if (parallaxEnabled) {
        const distribution = distributeEmojis(count);
        
        if (distribution.front > 0) {
          frontRemaining = distribution.front;
          const slowestLayerTime = Math.max(
            ...Object.keys(parallaxConfig.layerProperties).map(layer => {
              const layerConf = parallaxConfig.layerProperties[layer];
              return convertSpeedToFallDuration(layerConf.speedRange[1]);
            })
          );
          const intervalTime = (slowestLayerTime * 1000) / (frontRemaining || 1);
          
          frontInterval = setInterval(() => {
            if (frontRemaining <= 0) {
              clearInterval(frontInterval);
              frontInterval = null;
            } else {
              const emoji = createEmoji(emojiSet, true, 'front');
              rainContainer.appendChild(emoji);
              frontRemaining--;
            }
          }, intervalTime);
        }
        
        if (distribution.middle > 0) {
          for (let i = 0; i < distribution.middle; i++) {
            const emoji = createEmoji(emojiSet, true, 'middle');
            rainContainer.appendChild(emoji);
          }
        }
        
        if (distribution.back > 0) {
          for (let i = 0; i < distribution.back; i++) {
            const emoji = createEmoji(emojiSet, true, 'back');
            rainContainer.appendChild(emoji);
          }
        }
      } else {
        for (let i = 0; i < count; i++) {
          const emoji = createEmoji(emojiSet, true, 'middle');
          rainContainer.appendChild(emoji);
        }
      }
    };

    const showSingleEmoji = (emojiSet) => {
      const rainContainer = document.getElementById("rainContainer");
      // Create emoji that starts from above and falls immediately
      const emoji = createEmoji(emojiSet, true); // true means drop immediately
      rainContainer.appendChild(emoji);
    };

    const dropSingleEmoji = (emojiSet) => {
      const rainContainer = document.getElementById("rainContainer");
      const emoji = createEmoji(emojiSet, true);
      rainContainer.appendChild(emoji);
    };

    const rainFewEmojis = (emojiSet) => {
      const rainContainer = document.getElementById("rainContainer");
      const count = 5;
      if (parallaxEnabled) {
        const distribution = distributeEmojis(count);
        for (let layer in distribution) {
          for (let i = 0; i < distribution[layer]; i++) {
            const emoji = createEmoji(emojiSet, true, layer);
            rainContainer.appendChild(emoji);
          }
        }
      } else {
        for (let i = 0; i < count; i++) {
          const emoji = createEmoji(emojiSet, true, 'middle');
          rainContainer.appendChild(emoji);
        }
      }
    };

    const clearEmojis = () => {
      const rainContainer = document.getElementById("rainContainer");
      const emojis = rainContainer.querySelectorAll('.emoji');
      
      if (frontInterval) {
        clearInterval(frontInterval);
        frontInterval = null;
        frontRemaining = 0;
      }
      
      // Clear all emojis with random delays within 2 seconds, quick fade-out
      emojis.forEach((emoji, index) => {
        // Random delay between 0 and 1.7 seconds (leaving 0.3s for fade-out)
        const randomDelay = Math.random() * 1700;
        // Quick fade-out duration between 0.1-0.3 seconds
        const fadeOutDuration = getRandomValue(0.1, 0.3);
        
        setTimeout(() => {
          emoji.style.transition = `opacity ${fadeOutDuration}s ease-out`;
          emoji.style.opacity = '0';
          
          // Remove element after fade-out completes
          setTimeout(() => {
            emoji.remove();
          }, fadeOutDuration * 1000);
        }, randomDelay);
      });
    };

    // Z-Index management
    let zIndexMode = 'individual';
    
    const updateZIndexValues = () => {
      const mode = document.getElementById('zIndexMode').value;
      const baseZ = parseInt(document.getElementById('baseZIndex').value) || 10;
      
      switch (mode) {
        case 'individual':
          // Use individual values as they are
          break;
        case 'relative':
          parallaxConfig.layerProperties.middle.zIndex = baseZ;
          parallaxConfig.layerProperties.front.zIndex = baseZ + 1;
          parallaxConfig.layerProperties.back.zIndex = baseZ - 1;
          break;
        case 'autoFront':
          parallaxConfig.layerProperties.front.zIndex = 20;
          parallaxConfig.layerProperties.middle.zIndex = 20;
          parallaxConfig.layerProperties.back.zIndex = 20;
          break;
        case 'autoBack':
          parallaxConfig.layerProperties.front.zIndex = 1;
          parallaxConfig.layerProperties.middle.zIndex = 1;
          parallaxConfig.layerProperties.back.zIndex = 1;
          break;
      }
      
      // Update individual controls display
      if (mode === 'individual') {
        document.getElementById('frontZIndex').value = parallaxConfig.layerProperties.front.zIndex;
        document.getElementById('middleZIndex').value = parallaxConfig.layerProperties.middle.zIndex;
        document.getElementById('backZIndex').value = parallaxConfig.layerProperties.back.zIndex;
      }
    };

    // UI Control event listeners
    const baseSpeedInput = document.getElementById('baseSpeedInput');
    const frontRatioInput = document.getElementById('frontRatioInput');
    const middleRatioInput = document.getElementById('middleRatioInput');
    const backRatioInput = document.getElementById('backRatioInput');
    
    // All control IDs (removed z-index controls as they're handled separately)
    const controlIds = [
      'frontSpeedRangeMin', 'frontSpeedRangeMax', 'frontBlurRangeMin', 'frontBlurRangeMax',
      'frontFontSizeMin', 'frontFontSizeMax', 'frontDelayMin', 'frontDelayMax',
      'middleSpeedRangeMin', 'middleSpeedRangeMax', 'middleBlurRangeMin', 'middleBlurRangeMax',
      'middleFontSizeMin', 'middleFontSizeMax', 'middleDelayMin', 'middleDelayMax',
      'backSpeedRangeMin', 'backSpeedRangeMax', 'backBlurRangeMin', 'backBlurRangeMax',
      'backFontSizeMin', 'backFontSizeMax', 'backDelayMin', 'backDelayMax'
    ];

    // Base speed
    baseSpeedInput.addEventListener('input', (e) => {
      let value = parseInt(e.target.value, 10);
      if (isNaN(value)) value = 50;
      else if (value < 0) value = 0;
      else if (value > 100) value = 100;
      parallaxConfig.baseSpeed = value;
    });

    // Layer ratios
    frontRatioInput.addEventListener('input', (e) => {
      let value = parseInt(e.target.value, 10);
      if (isNaN(value)) value = 100;
      else if (value < 0) value = 0;
      else if (value > 10000) value = 10000;
      parallaxConfig.layerRatios.front = value;
    });

    middleRatioInput.addEventListener('input', (e) => {
      let value = parseInt(e.target.value, 10);
      if (isNaN(value)) value = 300;
      else if (value < 0) value = 0;
      else if (value > 10000) value = 10000;
      parallaxConfig.layerRatios.middle = value;
    });

    backRatioInput.addEventListener('input', (e) => {
      let value = parseInt(e.target.value, 10);
      if (isNaN(value)) value = 70;
      else if (value < 0) value = 0;
      else if (value > 10000) value = 10000;
      parallaxConfig.layerRatios.back = value;
    });

    // Set up all layer control listeners
    function setupLayerControls() {
      controlIds.forEach(id => {
        const element = document.getElementById(id);
        if (!element) return;
        
        element.addEventListener('input', (e) => {
          let value = parseFloat(e.target.value);
          const parts = id.split(/(?=[A-Z])/);
          const layer = parts[0];
          const property = parts.slice(1).join('');
          
          // Validate value
          if (isNaN(value)) value = parseFloat(element.defaultValue);
          const min = parseFloat(element.min);
          const max = parseFloat(element.max);
          if (value < min) value = min;
          if (value > max) value = max;
          
          // Update config
          if (property.includes('Min')) {
            const propName = property.replace('Min', '');
            const propKey = propName.charAt(0).toLowerCase() + propName.slice(1) + 'Range';
            parallaxConfig.layerProperties[layer][propKey][0] = value;
          } else if (property.includes('Max')) {
            const propName = property.replace('Max', '');
            const propKey = propName.charAt(0).toLowerCase() + propName.slice(1) + 'Range';
            parallaxConfig.layerProperties[layer][propKey][1] = value;
          }
        });
      });
    }

    setupLayerControls();

    // Z-Index control event listeners
    document.getElementById('zIndexMode').addEventListener('change', (e) => {
      zIndexMode = e.target.value;
      const individualControls = document.getElementById('zIndexControls');
      const relativeControl = document.getElementById('relativeZIndexControl');
      
      if (zIndexMode === 'individual') {
        individualControls.style.display = 'grid';
        relativeControl.style.display = 'none';
      } else if (zIndexMode === 'relative') {
        individualControls.style.display = 'none';
        relativeControl.style.display = 'grid';
      } else {
        individualControls.style.display = 'none';
        relativeControl.style.display = 'none';
      }
      
      updateZIndexValues();
    });

    // Individual z-index controls
    document.getElementById('frontZIndex').addEventListener('input', (e) => {
      if (zIndexMode === 'individual') {
        parallaxConfig.layerProperties.front.zIndex = parseInt(e.target.value) || 3;
      }
    });

    document.getElementById('middleZIndex').addEventListener('input', (e) => {
      if (zIndexMode === 'individual') {
        parallaxConfig.layerProperties.middle.zIndex = parseInt(e.target.value) || 2;
      }
    });

    document.getElementById('backZIndex').addEventListener('input', (e) => {
      if (zIndexMode === 'individual') {
        parallaxConfig.layerProperties.back.zIndex = parseInt(e.target.value) || 1;
      }
    });

    // Relative z-index control
    document.getElementById('baseZIndex').addEventListener('input', (e) => {
      if (zIndexMode === 'relative') {
        updateZIndexValues();
      }
    });

    // Checkboxes
    document.getElementById("parallaxCheckbox").addEventListener("change", (e) => {
      parallaxEnabled = e.target.checked;
    });

    document.getElementById("blurCheckbox").addEventListener("change", (e) => {
      blurEnabled = e.target.checked;
    });

    // Buttons
    document.getElementById("rainButton").addEventListener("click", () => {
      triggerRain(themes.lunchPlan);
    });

    document.getElementById("singleEmoji").addEventListener("click", () => {
      showSingleEmoji(themes.lunchPlan);
    });

    document.getElementById("dropSingleEmoji").addEventListener("click", () => {
      dropSingleEmoji(themes.lunchPlan);
    });

    document.getElementById("rainFewEmojis").addEventListener("click", () => {
      rainFewEmojis(themes.lunchPlan);
    });

    document.getElementById("clearEmojis").addEventListener("click", () => {
      clearEmojis();
    });
  </script>
</body>
</html>
